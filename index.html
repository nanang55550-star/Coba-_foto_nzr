<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Kanvas Foto Asli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: #0b0c0e; /* Warna latar belakang gelap */
            /* Mengizinkan swipe bebas ke atas, bawah, kiri, kanan */
            overflow: auto;
            width: 100%;
            height: 100%;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        html:active, body:active {
            cursor: grabbing;
        }

        /* Kanvas luas yang mengelilingi galeri */
        .canvas {
            min-width: 220vw;
            min-height: 220vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px;
        }

        /* Tempat berkumpulnya foto: menyebar ke kiri-kanan & atas-bawah dari tengah */
        .photo-cluster {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 16px; /* Jarak antar foto */
            max-width: 1100px; /* Batas lebar agar foto melipat ke atas & bawah */
        }

        /* KUNCI: Foto mempertahankan rasio aslinya 100% tanpa dipotong */
        .photo-cluster img {
            height: 180px;            /* Tinggi dasar */
            width: auto;              /* Lebar otomatis menyesuaikan bentuk asli foto */
            border-radius: 10px;      /* Sudut foto sedikit melengkung rapi */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
        }

        /* Variasi tinggi dan sedikit kemiringan acak agar tampak estetik */
        .photo-cluster img:nth-child(odd) {
            transform: rotate(-1.5deg);
        }
        .photo-cluster img:nth-child(even) {
            transform: rotate(1.5deg);
        }
        .photo-cluster img:nth-child(3n) {
            height: 210px; /* Beberapa foto dibuat sedikit lebih besar */
            transform: rotate(0.8deg);
        }
        .photo-cluster img:nth-child(4n) {
            height: 160px; /* Beberapa foto dibuat sedikit lebih kecil */
            transform: rotate(-1deg);
        }

        /* Efek foto saat disentuh atau diarahkan jari/kursor */
        .photo-cluster img:hover {
            transform: scale(1.08) rotate(0deg);
            z-index: 10;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.85);
        }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="photo-cluster">
            <!-- 
                DAFTAR FOTO: 
                Masukkan semua foto Anda di sini. 
                Foto tidak akan terpotong (landscape tetap lebar, portrait tetap tegak).
            -->
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <img src="d065327c30b8211f2a0f80878ec31b83.jpg" alt="foto">
            <!-- Tambahkan terus tag <img> foto-foto Anda lainnya di sini -->
        </div>
    </div>

    <script>
        // Memastikan semua foto selesai dimuat terlebih dahulu,
        // lalu otomatis menggeser layar tepat ke bagian tengah galeri foto.
        window.addEventListener('load', () => {
            const centerX = (document.documentElement.scrollWidth - window.innerWidth) / 2;
            const centerY = (document.documentElement.scrollHeight - window.innerHeight) / 2;
            window.scrollTo(centerX, centerY);
        });
    </script>

</body>
</html>
